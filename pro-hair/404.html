<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | ProHair</title>
    <link rel="preload" href="/assets/fonts/montserrat/Montserrat-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 9rem);
            font-weight: 700;
            color: rgba(210, 180, 140, 0.4);
            margin: 0;
            line-height: 0.8;
            letter-spacing: -5px;
        }

        .error-title {
            font-size: 1.5rem;
            color: #4A3728;
            margin: 20px 0 10px;
            font-weight: 500;
        }

        .error-message {
            font-size: 1rem;
            color: rgba(74, 55, 40, 0.7);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .back-home {
            display: inline-block;
            padding: 14px 32px;
            background-color: transparent;
            color: #D2B48C;
            border: 1px solid #D2B48C;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: all 0.4s ease;
            border-radius: 2px;
        }

        .back-home:hover {
            background-color: #D2B48C;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(210, 180, 140, 0.15);
        }
    </style>
</head>

<body>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Strona nie została odnaleziona</h2>
        <p class="error-message">
            Wygląda na to, że link jest nieaktualny lub adres został wpisany błędnie.
        </p>
        <a href="/" class="back-home">Wróć do strony głównej</a>
    </div>

</body>

</html>
